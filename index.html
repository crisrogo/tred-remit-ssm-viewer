<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TRED / REMIT cardiac SSM viewer</title>
<link rel="stylesheet" href="./css/style.css">
<!-- Surface any load/runtime error on the page (module-import failures, blocked file://
     fetches, WebGL problems) instead of failing silently on "Loading…". -->
<script>
  window.__ssmReady = false;
  function __note(msg) {
    var n = document.getElementById('note');
    if (n) { n.textContent = msg; n.style.color = '#e08080'; }
  }
  window.addEventListener('error', function (e) {
    __note('Error: ' + (e.message || (e.error && e.error.message) || ('failed to load ' + (e.filename || 'a script'))));
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    __note('Error: ' + (e.reason && (e.reason.message || e.reason)));
  });
  window.addEventListener('load', function () {
    setTimeout(function () {
      var n = document.getElementById('note');
      if (!window.__ssmReady && n && /Loading/.test(n.textContent)) {
        __note('App did not start. Open the browser console (F12) for the error. Make sure you are viewing over http(s) (a web server or GitHub Pages), not a file:// path, in a recent browser.');
      }
    }, 4000);
  });
</script>
</head>
<body>
<div id="app">
  <aside id="panel">
    <h1>Cardiac SSM viewer</h1>
    <p class="sub">TRED / REMIT ortho-tree branches</p>

    <div class="group">
      <span class="lbl">Phase</span>
      <div id="phase-toggle" class="seg"></div>
    </div>

    <div class="group">
      <label class="lbl" for="item">Branch</label>
      <select id="item"></select>
    </div>

    <div class="group">
      <label class="lbl" for="morph">Morph: mean &rarr; <span id="morph-val">1.00&times;</span></label>
      <input id="morph" type="range">
      <div class="ticks"><span>mean</span><span>branch</span><span>exaggerated</span></div>
    </div>

    <div class="group">
      <span class="lbl">Surfaces</span>
      <div id="tags"></div>
    </div>

    <div class="group">
      <span class="lbl">Displacement from mean</span>
      <div id="cbar"></div>
      <div class="ticks"><span>0</span><span id="cbar-max">&ndash;</span></div>
    </div>

    <button id="reset">Reset view</button>
    <p id="note" class="note">Loading&hellip;</p>
    <p class="ver">build 3 &middot; free rotation</p>
  </aside>
  <main id="view"></main>
</div>
<script type="module" src="./js/main.js?v=3"></script>
</body>
</html>
